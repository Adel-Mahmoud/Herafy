<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إدارة المتبرعين - بنك الدم</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Tajawal', 'Arial', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: auto;
    background: #fff;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 28px;
}

h2:before {
    content: "🩸 ";
}

form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
    background: #f9f9f9;
    padding: 20px;
    border-radius: 15px;
}

input, select, button {
    padding: 12px;
    font-size: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    transition: all 0.3s ease;
    font-family: inherit;
}

input:focus, select:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}

button {
    cursor: pointer;
    background: #667eea;
    color: white;
    border: none;
    font-weight: bold;
    transition: transform 0.2s, background 0.2s;
}

button:hover {
    background: #764ba2;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: #fff;
    overflow-x: auto;
    display: block;
}

th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-weight: bold;
    position: sticky;
    top: 0;
}

tr:hover {
    background: #f5f5f5;
    transition: background 0.3s;
}

img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #667eea;
}

.actions button {
    margin: 2px;
    padding: 6px 12px;
    font-size: 12px;
}

.actions button:first-child {
    background: #4CAF50;
}

.actions button:first-child:hover {
    background: #45a049;
}

.actions button:last-child {
    background: #f44336;
}

.actions button:last-child:hover {
    background: #da190b;
}

.full {
    grid-column: 1 / -1;
}

@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    
    form {
        grid-template-columns: 1fr;
    }
    
    th, td {
        padding: 8px;
        font-size: 12px;
    }
    
    .actions button {
        padding: 4px 8px;
        font-size: 10px;
    }
}

.loading {
    text-align: center;
    padding: 20px;
    color: #667eea;
}

.empty-row td {
    text-align: center;
    padding: 40px;
    color: #999;
}

/* رسائل التنبيه المخصصة */
.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    z-index: 1000;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* مؤشر التحميل */
.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
<h2>إدارة بيانات المتبرعين</h2>

<form id="donorForm">
<input type="hidden" id="docId">

<input type="text" id="name" placeholder="👤 الاسم الكامل" required>
<input type="tel" id="phone" placeholder="📱 رقم الهاتف" required pattern="[0-9]{10,15}" title="يرجى إدخال رقم هاتف صحيح">

<select id="bloodType" required>
<option value="">🩸 فصيلة الدم</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>

<input type="number" id="age" placeholder="📅 العمر" required min="18" max="100">
<input type="text" id="governorate" placeholder="🏛️ المحافظة" required>
<input type="text" id="city" placeholder="🏙️ المدينة" required>
<input type="text" id="area" placeholder="📍 المنطقة" required>
<input type="date" id="lastDonation" required>
<input type="email" id="email" placeholder="📧 البريد الإلكتروني" required>
<input type="url" id="photoUrl" placeholder="🖼️ رابط الصورة الشخصية" required>

<button type="submit" class="full" id="submitBtn">💾 حفظ البيانات</button>
<button type="button" class="full" id="resetBtn" style="background:#999;">🗑️ إعادة تعيين</button>
</form>

<div style="overflow-x: auto;">
<table>
<thead>
<tr>
<th>الصورة</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>الفصيلة</th>
<th>العمر</th>
<th>المحافظة</th>
<th>المدينة</th>
<th>المنطقة</th>
<th>آخر تبرع</th>
<th>البريد</th>
<th>إجراءات</th>
</tr>
</thead>
<tbody id="donorsTable"></tbody>
</table>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyDb_-Pl7fMEQiBnYmi1TqZeASQMSLbwAnk",
    authDomain: "alaa-760fd.firebaseapp.com",
    databaseURL: "https://alaa-760fd.firebaseio.com",
    projectId: "alaa-760fd",
    storageBucket: "alaa-760fd.firebasestorage.app",
    messagingSenderId: "110443455564",
    appId: "1:110443455564:web:78a530522599d8aa5680e9",
    measurementId: "G-PNT0S6D9MT"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const donorForm = document.getElementById("donorForm");
const donorsTable = document.getElementById("donorsTable");
const submitBtn = document.getElementById("submitBtn");

// دالة لعرض رسالة منبثقة
function showMessage(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    toast.style.background = isError ? '#f44336' : '#4CAF50';
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
    }, 3000);
}

// دالة لعرض مؤشر تحميل
function setLoading(isLoading) {
    if (isLoading) {
        submitBtn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
        submitBtn.disabled = true;
    } else {
        submitBtn.innerHTML = '💾 حفظ البيانات';
        submitBtn.disabled = false;
    }
}

// تحميل جميع المتبرعين
async function loadDonors() {
    donorsTable.innerHTML = '<tr><td colspan="11" class="loading">⌛ جاري تحميل البيانات...</td></tr>';
    
    try {
        const q = query(collection(db, "donors"), orderBy("name"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
            donorsTable.innerHTML = '<tr><td colspan="11" class="empty-row">📭 لا يوجد متبرعون حتى الآن</td></tr>';
            return;
        }
        
        donorsTable.innerHTML = "";
        querySnapshot.forEach((docSnap) => {
            const d = docSnap.data();
            
            // التحقق من وجود الصورة
            const photoUrl = d.photoUrl && d.photoUrl !== "" ? d.photoUrl : "https://via.placeholder.com/50";
            
            donorsTable.innerHTML += `
            <tr>
                <td><img src="${photoUrl}" alt="${d.name}" onerror="this.src='https://via.placeholder.com/50'"></td>
                <td>${escapeHtml(d.name)}</td>
                <td>${escapeHtml(d.phone)}</td>
                <td style="font-weight:bold;color:#667eea;">${escapeHtml(d.bloodType)}</td>
                <td>${escapeHtml(d.age)}</td>
                <td>${escapeHtml(d.governorate)}</td>
                <td>${escapeHtml(d.city)}</td>
                <td>${escapeHtml(d.area)}</td>
                <td>${formatDate(d.lastDonation)}</td>
                <td>${escapeHtml(d.email)}</td>
                <td class="actions">
                    <button onclick="window.editDonor('${docSnap.id}', ${JSON.stringify(escapeHtmlForJson(d))})">✏️ تعديل</button>
                    <button onclick="window.removeDonor('${docSnap.id}')">🗑️ حذف</button>
                </td>
            </tr>
            `;
        });
    } catch (error) {
        console.error("خطأ في التحميل:", error);
        donorsTable.innerHTML = '<tr><td colspan="11" class="empty-row">❌ حدث خطأ في تحميل البيانات</td></tr>';
        showMessage("❌ فشل تحميل البيانات: " + error.message, true);
    }
}

// دالة لتنسيق التاريخ
function formatDate(dateString) {
    if (!dateString) return "غير محدد";
    const date = new Date(dateString);
    return date.toLocaleDateString('ar-EG');
}

// دالة لمنع هجمات XSS
function escapeHtml(text) {
    if (!text) return "";
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// دالة لتشفير البيانات لـ JSON
function escapeHtmlForJson(obj) {
    const newObj = {};
    for (let key in obj) {
        if (obj.hasOwnProperty(key)) {
            newObj[key] = escapeHtml(String(obj[key]));
        }
    }
    return newObj;
}

// حفظ أو تحديث البيانات
donorForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const id = document.getElementById("docId").value;
    
    // التحقق من صحة البيانات
    const phone = document.getElementById("phone").value;
    if (!phone.match(/^[0-9]{10,15}$/)) {
        showMessage("⚠️ رقم الهاتف يجب أن يكون 10-15 رقم", true);
        return;
    }
    
    const age = parseInt(document.getElementById("age").value);
    if (age < 18 || age > 100) {
        showMessage("⚠️ العمر يجب أن يكون بين 18 و 100 سنة", true);
        return;
    }
    
    const donorData = {
        name: document.getElementById("name").value.trim(),
        phone: phone,
        bloodType: document.getElementById("bloodType").value,
        age: age,
        governorate: document.getElementById("governorate").value.trim(),
        city: document.getElementById("city").value.trim(),
        area: document.getElementById("area").value.trim(),
        lastDonation: document.getElementById("lastDonation").value,
        email: document.getElementById("email").value.trim(),
        photoUrl: document.getElementById("photoUrl").value.trim(),
        updatedAt: new Date().toISOString()
    };
    
    setLoading(true);
    
    try {
        if (id) {
            await updateDoc(doc(db, "donors", id), donorData);
            showMessage("✅ تم تحديث بيانات المتبرع بنجاح");
        } else {
            await addDoc(collection(db, "donors"), donorData);
            showMessage("✅ تم إضافة المتبرع بنجاح");
        }
        
        donorForm.reset();
        document.getElementById("docId").value = "";
        await loadDonors();
    } catch (error) {
        console.error("خطأ في الحفظ:", error);
        showMessage("❌ فشل حفظ البيانات: " + error.message, true);
    } finally {
        setLoading(false);
    }
});

// حذف متبرع
window.removeDonor = async function(id) {
    if(confirm("⚠️ هل أنت متأكد من حذف هذا المتبرع؟")) {
        setLoading(true);
        try {
            await deleteDoc(doc(db, "donors", id));
            showMessage("✅ تم حذف المتبرع بنجاح");
            await loadDonors();
        } catch (error) {
            showMessage("❌ فشل الحذف: " + error.message, true);
        } finally {
            setLoading(false);
        }
    }
}

// تعديل متبرع
window.editDonor = function(id, safeData) {
    try {
        const d = safeData;
        
        document.getElementById("docId").value = id;
        document.getElementById("name").value = d.name;
        document.getElementById("phone").value = d.phone;
        document.getElementById("bloodType").value = d.bloodType;
        document.getElementById("age").value = d.age;
        document.getElementById("governorate").value = d.governorate;
        document.getElementById("city").value = d.city;
        document.getElementById("area").value = d.area;
        document.getElementById("lastDonation").value = d.lastDonation;
        document.getElementById("email").value = d.email;
        document.getElementById("photoUrl").value = d.photoUrl;
        
        // التمرير إلى النموذج
        document.getElementById("donorForm").scrollIntoView({ behavior: 'smooth' });
        showMessage("✏️ يمكنك الآن تعديل البيانات");
    } catch (error) {
        showMessage("❌ حدث خطأ في تحميل بيانات التعديل", true);
    }
}

// زر إعادة تعيين النموذج
document.getElementById("resetBtn").addEventListener("click", () => {
    if(confirm("هل تريد مسح جميع البيانات من النموذج؟")) {
        donorForm.reset();
        document.getElementById("docId").value = "";
        showMessage("🔄 تم إعادة تعيين النموذج");
    }
});

// تحميل البيانات عند بدء التشغيل
loadDonors().catch(console.error);
// فحص كامل للخدمات
async function checkDB() {
  console.log("🔄 جاري فحص الاتصال...");
  try {
    const test = await getDocs(collection(db, "donors"));
    console.log(`✅ متصل | عدد السجلات: ${test.size}`);
    console.log(`📁 المشروع: ${firebaseConfig.projectId}`);
  } catch (err) {
    console.log(`❌ خطأ: ${err.code || err.message}`);
  }
}
checkDB();
</script>
</body>
</html>
